<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1650" viewBox="0 0 2400 1650">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#1e3a67"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7e8ee"/>
      <stop offset="100%" stop-color="#b7cdd0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14213d" flood-opacity="0.16"/>
    </filter>
    <style>
      text { font-family: Arial, "Segoe UI", sans-serif; fill: #14213d; }
      .title { font-size: 36px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 19px; fill: #d8e6f7; }
      .section-title { font-size: 23px; font-weight: 700; fill: #14213d; }
      .section-code { font-size: 15px; fill: #62738b; }
      .label { font-size: 17px; font-weight: 700; fill: #14213d; }
      .body { font-size: 15px; fill: #33445d; }
      .small { font-size: 13px; fill: #62738b; }
      .tiny { font-size: 11px; fill: #62738b; }
      .chip { font-size: 13px; font-weight: 700; fill: #243653; }
      .white-label { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d9e1ec; stroke-width: 2; }
      .soft-blue { fill: #edf5ff; stroke: #91bbef; stroke-width: 2; }
      .soft-purple { fill: #f8efff; stroke: #c59aef; stroke-width: 2; }
      .soft-orange { fill: #fff6e5; stroke: #f1b764; stroke-width: 2; }
      .soft-green { fill: #eaf8f1; stroke: #8ed5b2; stroke-width: 2; }
      .line { stroke: #cfd9e6; stroke-width: 2; }
      .callout { stroke: #6883a6; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="2400" height="1650" fill="#f5f7fb"/>

