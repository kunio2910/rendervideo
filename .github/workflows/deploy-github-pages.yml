name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - index.html
      - assets/**
      - favicon.svg
      - .nojekyll
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages export
        run: npm run build:pages

      - name: Commit generated Pages files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets favicon.svg .nojekyll
          if git diff --cached --quiet; then
            echo "No generated Pages changes to commit."
            exit 0
          fi
          git commit -m "chore: update GitHub Pages build [skip ci]"
          git push
